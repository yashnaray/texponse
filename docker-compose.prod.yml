name: texponse-prod
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uvicorn texponse.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8000:8000"]
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: {context: ., dockerfile: Dockerfile, target: runtime}
    command: celery -A texponse.tasks.background worker --loglevel=INFO --concurrency=4 --pool=prefork
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped

  beat:
    build: {context: ., dockerfile: Dockerfile, target: runtime}
    command: celery -A texponse.tasks.background beat --loglevel=INFO
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
    depends_on: [worker]
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cloudflare Tunnel (edge ingress, no open ports needed) ──
  # Requires CLOUDFLARE_TUNNEL_TOKEN from Zero Trust dashboard
  # (or mount ./docker/cloudflared-config.yml + credentials for config-file mode).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  redis_data:
