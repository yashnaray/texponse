name: texponse
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uv run uvicorn texponse.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres, qdrant, redis]
    volumes: ["./src:/app/src"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uv run celery -A texponse.tasks.background worker --loglevel=INFO --concurrency=4 --pool=solo
    env_file: .env
    depends_on: [postgres, qdrant, redis]
    volumes: ["./src:/app/src"]

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uv run celery -A texponse.tasks.background beat --loglevel=INFO
    env_file: .env
    depends_on: [postgres, qdrant, redis, worker]
    volumes: ["./src:/app/src"]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: texponse
      POSTGRES_PASSWORD: texponse_dev
      POSTGRES_DB: texponse
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/texponse/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U texponse"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__TOKEN: texponse_dev_token
      QDRANT__SERVICE__MAX_REQUESTS_PER_SECOND: 1000

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --requirepass texponse_dev
    volumes: [redis_data:/data]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana-enterprise:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: texponse_dev
    depends_on: [prometheus]
    volumes:
      - grafana_data:/var/lib/grafana

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  grafana_data:
